<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/style.css" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="weather-app">
      <header>
        <form class="search-form">
          <input
            type="search"
            placeholder="Enter a city..."
            required
            class="search-form-input"
          />
          <input type="submit" value="Search" class="search-form-button" />
        </form>
      </header>
      <main>
        <div>
          <h1>Windhoek</h1>
          <p>
            Thursday 16:00, cloudy <br />
            Humidity: 60%, Wind: 3.13km/h
          </p>
        </div>
        <div>☁️ 20°C</div>
      </main>
      <footer>
        Project coded by
        <a href="https://github.com/Ndinelago-Asser" target="_blank">
          Ndinelago J Asser
        </a>
        is
        <a href="https://github.com/Ndinelago-Asser/weather" target="_blank">
          open-sourced on Github</a
        >
        and
        <a href="https://weatherappndinelago.netlify.app" target="_blank">
          hosted on Netlify
        </a>
      </footer>
    </div>
  </body>
</html>
